name: build

on:
  workflow_dispatch:
    inputs:
      full_kernel_build:
        description: '强制完整内核构建（重新生成 Module.symvers）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  KERNEL_BRANCH: android15-6.6-2026-01
  CLANG_BRANCH: main-kernel-build-2024
  DDK_TARGET: android15-6.6

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore script exec bits
        run: chmod +x tests/*.sh tools/*.sh
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ripgrep
      - name: Run static checks
        run: tests/static-check.sh

  build:
    name: module android15-6.6
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore script exec bits
        run: chmod +x tests/*.sh tools/*.sh

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip flex bison build-essential \
            zlib1g-dev libncurses-dev xz-utils libssl-dev bc cpio python3 \
            clang lld llvm dwarves libelf-dev git

      - name: Restore GKI source cache
        id: src_cache
        uses: actions/cache/restore@v4
        with:
          path: android-kernel
          key: gki-src-${{ env.KERNEL_BRANCH }}-v2

      - name: Download kernel source (android15-6.6-2026-01)
        if: steps.src_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-kernel/common
          curl -fsSL --retry 3 \
            "https://android.googlesource.com/kernel/common/+archive/refs/heads/${KERNEL_BRANCH}.tar.gz" \
            | tar -xzf - -C android-kernel/common
          test -f android-kernel/common/Makefile || {
            echo "::error::kernel source tree incomplete"; exit 1; }

      - name: Download prebuilt clang
        if: steps.src_cache.outputs.cache-hit != 'true'
        run: |
          clang_ver="$(grep -oP '^CLANG_VERSION=\K\S+' \
            android-kernel/common/build.config.constants)"
          test -n "$clang_ver" || {
            echo "::error::cannot resolve CLANG_VERSION"; exit 1; }
          echo "Pinned clang: $clang_ver"
          mkdir -p "android-kernel/prebuilts/clang/host/linux-x86/$clang_ver"
          curl -fsSL --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-$clang_ver.tar.gz" \
            | tar -xzf - -C "android-kernel/prebuilts/clang/host/linux-x86/$clang_ver"
          test -x "android-kernel/prebuilts/clang/host/linux-x86/$clang_ver/bin/clang" || {
            echo "::error::prebuilt clang archive incomplete"; exit 1; }
          df -h "$GITHUB_WORKSPACE"

      - name: Put prebuilt clang on PATH
        run: |
          clang_bin="$(ls -d "$GITHUB_WORKSPACE"/android-kernel/prebuilts/clang/host/linux-x86/clang-*/bin 2>/dev/null | sort | tail -n1)"
          if [ -n "$clang_bin" ] && [ -x "$clang_bin/clang" ]; then
            echo "$clang_bin" >> "$GITHUB_PATH"
            echo "Using prebuilt clang: $clang_bin"
          else
            echo "::warning::prebuilt clang unavailable; falling back to distro clang"
          fi

      - name: Kernel defconfig + modules_prepare
        run: |
          cd android-kernel/common
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Save GKI source cache (prepared state)
        if: steps.src_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-kernel
          key: gki-src-${{ env.KERNEL_BRANCH }}-v2

      - name: Restore Module.symvers cache
        id: symvers_cache
        uses: actions/cache/restore@v4
        with:
          path: android-kernel/common/Module.symvers
          key: gki-symvers-${{ env.KERNEL_BRANCH }}-v2

      - name: Build kernel for Module.symvers (first run / forced)
        if: >
          steps.symvers_cache.outputs.cache-hit != 'true' ||
          inputs.full_kernel_build == true
        run: |
          cd android-kernel/common
          # 完整 vmlinux 构建的唯一目的：产出与 KMI 冻结分支一致的 Module.symvers
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1
          test -f Module.symvers || {
            echo "::error::Module.symvers missing after kernel build"; exit 1; }

      - name: Save Module.symvers cache
        if: steps.symvers_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-kernel/common/Module.symvers
          key: gki-symvers-${{ env.KERNEL_BRANCH }}-v2

      - name: Build dsu_permissive.ko
        run: |
          make module KDIR="$GITHUB_WORKSPACE/android-kernel/common" \
            DSU_DDK_TARGET="$DDK_TARGET"
          cp -f out/dsu_permissive.ko "out/dsu_permissive-$DDK_TARGET.ko"

      - name: Build loader and assemble artifacts
        run: |
          make -C loader clean all
          cp -f loader/dsuinit out/dsuinit
          cp -f tools/patch-init-boot-android.sh out/patch-init-boot-android.sh
          cp -f tools/repatch-init-boot-config-android.sh out/repatch-init-boot-config-android.sh
          chmod 0755 out/patch-init-boot-android.sh out/repatch-init-boot-config-android.sh out/dsuinit
          magiskboot_path=$(tools/fetch-static-magiskboot.sh)
          cp -f "$magiskboot_path" out/magiskboot-arm64
          chmod 0755 out/magiskboot-arm64

      - name: Verify artifacts
        run: |
          tools/verify-artifacts.sh \
            --loader out/dsuinit \
            --module "out/dsu_permissive-$DDK_TARGET.ko" \
            --target "$DDK_TARGET"

      - name: Generate on-device flasher (single target)
        run: |
          tools/generate-android-flasher.sh \
            --target "$DDK_TARGET" \
            --module-dir out \
            --loader out/dsuinit \
            --magiskboot out/magiskboot-arm64 \
            --selinux 0 --avb 1 --verity-table-spoof 0 \
            --output out/dsu-permissive-flasher.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsu-permissive-${{ env.DDK_TARGET }}
          if-no-files-found: error
          path: |
            out/dsu_permissive-${{ env.DDK_TARGET }}.ko
            out/dsuinit
            out/magiskboot-arm64
            out/patch-init-boot-android.sh
            out/repatch-init-boot-config-android.sh
            out/dsu-permissive-flasher.sh
            android-kernel/common/Module.symvers
