name: Patch init_boot DSU


on:
  workflow_dispatch:


jobs:

  patch:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout repository
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          cpio \
          gzip \
          unzip \
          file \
          wget \
          curl



    # 使用项目自带脚本获取 magiskboot
    - name: Prepare magiskboot
      run: |

        chmod +x tools/fetch-static-magiskboot.sh


        echo "Fetching magiskboot..."


        bash tools/fetch-static-magiskboot.sh > magiskboot_path.txt


        MAGISKBOOT=$(cat magiskboot_path.txt | tail -n 1)


        echo "Detected magiskboot:"
        echo "$MAGISKBOOT"


        cp "$MAGISKBOOT" ./magiskboot


        chmod +x ./magiskboot



    # 检查工具架构
    - name: Check magiskboot
      run: |

        echo "===== magiskboot ====="

        ls -lh ./magiskboot


        file ./magiskboot


        echo "===== test ====="

        ./magiskboot --help || true



    # 检查输入文件
    - name: Check files
      run: |

        echo "===== files ====="


        ls -lh


        echo "===== init_boot ====="

        file init_boot.img


        echo "===== loader ====="

        file dsuinit


        echo "===== module ====="

        file dsu_permissive-android15-6.6.ko



    # 开始修改 init_boot
    - name: Patch init_boot
      run: |


        chmod +x tools/patch-init-boot-android.sh


        chmod +x dsuinit


        bash tools/patch-init-boot-android.sh \
          --input ./init_boot.img \
          --output ./init_boot_dsu.img \
          --loader ./dsuinit \
          --module ./dsu_permissive-android15-6.6.ko \
          --selinux 1 \
          --avb 1 \
          --verity-table-spoof 1 \
          --magiskboot ./magiskboot



    # 验证生成文件
    - name: Verify output
      run: |

        echo "===== result ====="


        ls -lh init_boot_dsu.img


        file init_boot_dsu.img



    # 上传
    - name: Upload image
      uses: actions/upload-artifact@v4

      with:

        name: init_boot_dsu

        path: init_boot_dsu.img
