name: Patch init_boot with DSU-Permissive

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3 \
            cpio \
            lz4 \
            zstd \
            unzip


      - name: Give permission
        run: |
          chmod +x \
          magiskboot-arm64 \
          dsuinit \
          patch-init-boot-android.sh \
          repatch-init-boot-config-android.sh


      - name: Check files
        run: |
          ls -lah


      - name: Patch init_boot
        run: |

          ./patch-init-boot-android.sh \
          --input init_boot.img \
          --output init_boot_dsu.img \
          --loader dsuinit \
          --module dsu_permissive-android15-6.6.ko \
          --selinux 1 \
          --avb 1 \
          --verity-table-spoof 1 \
          --magiskboot ./magiskboot-arm64


      - name: Repatch bootconfig
        run: |

          ./repatch-init-boot-config-android.sh \
          init_boot_dsu.img


      - name: Check output
        run: |
          ls -lah


      - name: Upload patched image
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_dsu
          path: |
            init_boot_dsu.img
