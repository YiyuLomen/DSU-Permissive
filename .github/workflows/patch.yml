name: Patch init_boot DSU


on:
  workflow_dispatch:


jobs:

  patch:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cpio gzip unzip file wget



    # 获取 x86_64 magiskboot
    - name: Download magiskboot
      run: |

        wget -O magiskboot \
        https://raw.githubusercontent.com/KernelSU-Next/MagiskBoot/main/bin/x86_64/magiskboot

        chmod +x magiskboot


    # 检查 magiskboot
    - name: Check magiskboot
      run: |

        ls -lh magiskboot

        file magiskboot

        ./magiskboot --help || true



    # 检查文件
    - name: Check input files
      run: |

        ls -lh

        file init_boot.img

        file dsuinit

        file dsu_permissive-android15-6.6.ko



    # 开始修改 init_boot
    - name: Patch init_boot
      run: |

        chmod +x tools/patch-init-boot-android.sh

        chmod +x dsuinit


        bash tools/patch-init-boot-android.sh \
        --input ./init_boot.img \
        --output ./init_boot_dsu.img \
        --loader ./dsuinit \
        --module ./dsu_permissive-android15-6.6.ko \
        --selinux 1 \
        --avb 1 \
        --verity-table-spoof 1 \
        --magiskboot ./magiskboot



    # 验证
    - name: Verify result
      run: |

        ls -lh init_boot_dsu.img

        file init_boot_dsu.img



    # 上传结果
    - name: Upload init_boot_dsu
      uses: actions/upload-artifact@v4

      with:

        name: init_boot_dsu

        path: init_boot_dsu.img
