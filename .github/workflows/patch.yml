name: Patch init_boot

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y unzip cpio gzip


    - name: Download Magisk
      run: |
        wget -O Magisk.apk \
        https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk

        unzip -o Magisk.apk -d magisk


    - name: Prepare magiskboot
      run: |

        find magisk -name "*magiskboot*"

        cp magisk/lib/x86_64/libmagiskboot.so magiskboot

        chmod +x magiskboot


    - name: Patch init_boot
      run: |

        chmod +x tools/patch-init-boot-android.sh

        chmod +x dsuinit

        bash tools/patch-init-boot-android.sh \
        --input ./init_boot.img \
        --output ./init_boot_dsu.img \
        --loader ./dsuinit \
        --module ./dsu_permissive-android15-6.6.ko \
        --selinux 1 \
        --avb 1 \
        --verity-table-spoof 1 \
        --magiskboot ./magiskboot



    - name: Upload result
      uses: actions/upload-artifact@v4
      with:

        name: init_boot_dsu

        path: init_boot_dsu.img
