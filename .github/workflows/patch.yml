name: Build DSU init_boot


on:
  workflow_dispatch:


jobs:

  patch:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y cpio gzip unzip file


    - name: Prepare magiskboot
      run: |

        chmod +x tools/fetch-static-magiskboot.sh

        MAGISKBOOT=$(bash tools/fetch-static-magiskboot.sh)

        echo "magiskboot=$MAGISKBOOT"

        cp "$MAGISKBOOT" ./magiskboot

        chmod +x ./magiskboot

        file ./magiskboot



    - name: Patch init_boot

      run: |

        chmod +x tools/patch-init-boot-android.sh

        chmod +x dsuinit


        bash tools/patch-init-boot-android.sh \
        --input ./init_boot.img \
        --output ./init_boot_dsu.img \
        --loader ./dsuinit \
        --module ./dsu_permissive-android15-6.6.ko \
        --selinux 1 \
        --avb 1 \
        --verity-table-spoof 1 \
        --magiskboot ./magiskboot



    - name: Verify

      run: |

        chmod +x tools/verify-init-boot.sh

        tools/verify-init-boot.sh \
        --input ./init_boot_dsu.img



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: init_boot_dsu

        path: init_boot_dsu.img
